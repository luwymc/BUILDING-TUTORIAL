<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>spiegelwand – Bau-Tutorial von luwymc</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Righteous&family=IBM+Plex+Mono:wght@400;700&display=swap');
  :root { --col: #8b5cf6; --deep: #0a080e; --panel: #110e18; --border: #1e1830; --muted: #665577; --light: #f0eef8; --green: #2ecc71; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--deep); color: var(--light); font-family: 'IBM Plex Mono', monospace; overflow-x: hidden; }
  .hero { padding: 80px 48px 60px; border-bottom: 2px solid var(--col); background: radial-gradient(ellipse at 70% 40%, rgba(139,92,246,0.1) 0%, transparent 60%); }
  .hero-eyebrow { font-size: 10px; letter-spacing: 5px; color: var(--col); text-transform: uppercase; margin-bottom: 24px; }
  .hero h1 { font-family: 'Righteous', sans-serif; font-size: clamp(60px, 12vw, 130px); line-height: 0.88; }
  .hero h1 em { font-style: normal; color: var(--col); display: block; }
  .hero-desc { margin-top: 32px; font-size: 12px; line-height: 1.9; color: var(--muted); max-width: 480px; }
  .pill-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px; }
  .pill { font-size: 9px; letter-spacing: 3px; text-transform: uppercase; padding: 7px 16px; border: 1px solid var(--border); color: var(--muted); }
  .pill.col { border-color: var(--col); color: var(--col); }
  .wrapper { max-width: 900px; margin: 0 auto; padding: 0 40px; }
  .section { padding: 60px 0; border-bottom: 1px solid var(--border); }
  .section-label { font-size: 9px; letter-spacing: 5px; color: var(--col); text-transform: uppercase; margin-bottom: 10px; }
  .section h2 { font-family: 'Righteous', sans-serif; font-size: clamp(28px, 4vw, 48px); margin-bottom: 28px; }
  .step { display: grid; grid-template-columns: 60px 1fr; gap: 24px; padding: 32px 0; border-bottom: 1px solid var(--border); }
  .step-num { font-family: 'Righteous', sans-serif; font-size: 48px; color: var(--col); opacity: 0.5; line-height: 1; }
  .step h3 { font-family: 'Righteous', sans-serif; font-size: 22px; margin-bottom: 10px; }
  .step p { font-size: 12px; color: var(--muted); line-height: 1.9; max-width: 560px; }
  .tip { margin-top: 12px; padding: 10px 14px; border-left: 3px solid var(--col); background: rgba(139,92,246,0.05); font-size: 11px; color: var(--col); line-height: 1.7; }
  .footer { padding: 60px 40px; text-align: center; background: #070509; border-top: 2px solid var(--col); }
  .footer h2 { font-family: 'Righteous', sans-serif; font-size: clamp(36px, 8vw, 80px); color: var(--col); letter-spacing: 2px; }
  .footer p { font-size: 11px; color: var(--muted); margin-top: 14px; letter-spacing: 2px; }
  @media (max-width: 600px) { .hero { padding: 60px 24px 48px; } .wrapper { padding: 0 24px; } }
</style>
</head>
<body>
<section class="hero">
  <div class="hero-eyebrow">Macher Festival · DIY Tutorial</div>
  <h1>COMING<em>SOON</em></h1>
  <p class="hero-desc">Dieses Tutorial wird gerade gebaut. Komm bald wieder!</p>
  <div class="pill-row"><div class="pill col">In Arbeit</div></div>
</section>
<footer class="footer">
  <h2>BALD DA</h2>
  <p>Macher Festival · Ferropolis · 6.–9. August 2026</p>
  <p style="margin-top:14px; font-size:11px; letter-spacing:3px; color:var(--col);">von luwymc</p>
</footer>
</body>
</html>
